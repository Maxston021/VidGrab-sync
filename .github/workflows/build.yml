name: Build VidGrab IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /home/runner/theos
  PYFW_DIR: /home/runner/pyios/ios-arm64
  FFMPEG_DEST: /home/runner/ffmpeg-ios
  YTDLP_VER: "2026.08.19"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang lld git curl wget python3 python3-pip \
          libxml2-dev libssl-dev zlib1g-dev xz-utils cpio pkg-config zip unzip
        pip3 install uv
        echo "Base dependencies installed"

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_PATH
        echo "Theos installed"
        ls -la $THEOS/toolchain/linux/iphone/bin/ | head -20

    - name: Install iOS 17.0 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        # iOS SDK from xybp888/iOS-SDKs (zip format)
        SDK_URLS=(
          "https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.0-SDKs/iPhoneOS17.0.sdk.zip"
          "https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip"
        )
        for url in "${SDK_URLS[@]}"; do
          echo "Trying: $url"
          if curl -fL -o iPhoneOS.sdk.zip "$url" 2>/dev/null; then
            echo "Downloaded from $url"
            break
          fi
        done
        if [ -f iPhoneOS.sdk.zip ]; then
          unzip -q iPhoneOS.sdk.zip
          rm iPhoneOS.sdk.zip
          # Rename to expected name if needed
          if [ -d "iPhoneOS.sdk" ] && [ ! -d "iPhoneOS17.0.sdk" ]; then
            mv iPhoneOS.sdk iPhoneOS17.0.sdk
          fi
          ls -la $THEOS/sdks/
        else
          echo "ERROR: Failed to download iOS SDK"
          exit 1
        fi

    - name: Prepare Python.xcframework
      run: |
        mkdir -p /home/runner/pyios
        cd /home/runner/pyios
        # beeware/Python-Apple-support release format: tag=3.14-b12, asset=Python-3.14-iOS-support.b12.tar.gz
        PY_URLS=(
          "https://github.com/beeware/Python-Apple-support/releases/download/3.14-b12/Python-3.14-iOS-support.b12.tar.gz"
          "https://github.com/beeware/Python-Apple-support/releases/download/3.13-b16/Python-3.13-iOS-support.b16.tar.gz"
          "https://github.com/beeware/Python-Apple-support/releases/download/3.12-b11/Python-3.12-iOS-support.b11.tar.gz"
        )
        for url in "${PY_URLS[@]}"; do
          echo "Trying: $url"
          if curl -fL -o Python-support.tar.gz "$url" 2>/dev/null; then
            echo "Downloaded from $url"
            break
          fi
        done
        if [ -f Python-support.tar.gz ]; then
          tar -xzf Python-support.tar.gz
          rm Python-support.tar.gz
          # Find the xcframework
          XCFW=$(find . -name "Python.xcframework" -type d | head -1)
          if [ -n "$XCFW" ]; then
            echo "Found Python.xcframework at $XCFW"
            ls -la "$XCFW/"
            # Set up ios-arm64 slice
            if [ -d "$XCFW/ios-arm64" ]; then
              ln -sf "$(pwd)/$XCFW/ios-arm64" /home/runner/pyios/ios-arm64
            elif [ -d "$XCFW/ios-arm64_x86_64-simulator" ]; then
              echo "WARNING: Only simulator slice found"
            fi
            ls -la /home/runner/pyios/ios-arm64/ || true
            ls -la /home/runner/pyios/ios-arm64/Python.framework/ || true
          else
            echo "ERROR: Python.xcframework not found in archive"
            find . -name "*.framework" -type d | head -10
            exit 1
          fi
        else
          echo "ERROR: Failed to download Python.xcframework"
          exit 1
        fi

    - name: Prepare FFmpeg output directory
      run: |
        mkdir -p $FFMPEG_DEST/include $FFMPEG_DEST/lib

    - name: Build FFmpeg
      run: |
        cd /tmp
        git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
        export FFMPEG_SRC=/tmp/ffmpeg-src
        export FFMPEG_DEST=$FFMPEG_DEST
        export THEOS=$THEOS
        bash $GITHUB_WORKSPACE/tools/build_ffmpeg_ios.sh
        ls -la $FFMPEG_DEST/lib/

    - name: Prepare yt-dlp and Python packages
      run: |
        mkdir -p /home/runner/app_packages
        cd /home/runner/app_packages
        # Download yt-dlp
        echo "Downloading yt-dlp ${YTDLP_VER}..."
        curl -fL -o yt-dlp.tar.gz "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VER}/yt-dlp.tar.gz" || \
        curl -fL -o yt-dlp.tar.gz "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.tar.gz"
        echo "Download size: $(ls -la yt-dlp.tar.gz | awk '{print $5}')"
        echo "=== tar contents (first 20) ==="
        tar -tzf yt-dlp.tar.gz | head -20
        tar -xzf yt-dlp.tar.gz
        rm yt-dlp.tar.gz
        echo "=== After extract ==="
        ls -la
        # If yt-dlp dir exists, move yt_dlp out
        if [ -d "yt-dlp" ] && [ -d "yt-dlp/yt_dlp" ]; then
          echo "Moving yt_dlp from yt-dlp subdir"
          mv yt-dlp/yt_dlp .
          rm -rf yt-dlp
        fi
        echo "=== Final yt_dlp check ==="
        ls -la yt_dlp/ | head -5
        # Install Python packages
        uv pip install --target /home/runner/app_packages \
          requests certifi charset-normalizer idna urllib3 websockets
        # Install Python 3.14 for precompilation
        uv python install 3.14 || true
        ls -la /home/runner/app_packages/

    - name: Build main app
      run: |
        export THEOS=$THEOS
        export PYFW_DIR=/home/runner/pyios/ios-arm64
        make clean
        make FINALPACKAGE=1 2>&1 | tail -50
        ls -la .theos/obj/VidGrab.app/

    - name: Build HUD and Share extension
      run: |
        export THEOS=$THEOS
        make -C hud FINALPACKAGE=1 2>&1 | tail -20
        make -C share FINALPACKAGE=1 2>&1 | tail -20
        make -C helper FINALPACKAGE=1 2>&1 | tail -20 || true
        make -C starter FINALPACKAGE=1 2>&1 | tail -20 || true

    - name: Assemble IPA
      env:
        APP_PACKAGES: /home/runner/app_packages
        PYTHON_XCFRAMEWORK: /home/runner/pyios/Python.xcframework
        YTDLP_ZIP: ${{ github.workspace }}/Resources/yt-dlp
      run: |
        # Create yt-dlp zip
        mkdir -p $GITHUB_WORKSPACE/Resources
        cd /home/runner/app_packages
        if [ -d "yt_dlp" ]; then
          zip -r $GITHUB_WORKSPACE/Resources/yt-dlp.zip yt_dlp 2>&1 | tail -3
          mv $GITHUB_WORKSPACE/Resources/yt-dlp.zip $GITHUB_WORKSPACE/Resources/yt-dlp
        fi
        cd $GITHUB_WORKSPACE
        
        # Find ldid - search common locations
        echo "=== Searching for ldid ==="
        LDID=""
        for candidate in \
          "$THEOS/toolchain/linux/iphone/bin/ldid" \
          "$THEOS/bin/ldid" \
          "$THEOS/toolchain/linux/iphone/bin/ldid2" \
          "/usr/local/bin/ldid" \
          "/usr/bin/ldid"; do
          if [ -x "$candidate" ]; then
            LDID="$candidate"
            break
          fi
        done
        # Search Theos directory
        if [ -z "$LDID" ]; then
          LDID=$(find $THEOS -name "ldid*" -type f -executable 2>/dev/null | head -1)
        fi
        # If still not found, build from source
        if [ -z "$LDID" ]; then
          echo "ldid not found, building from source..."
          git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src
          cd /tmp/ldid-src
          make -j4 2>&1 | tail -5
          LDID=/tmp/ldid-src/ldid
          cd $GITHUB_WORKSPACE
        fi
        echo "Using LDID: $LDID"
        ls -la "$LDID"
        export LDID
        
        # Find Python 3.14 for precompilation
        echo "=== Finding Python 3.14 ==="
        PY314=$(uv python find 3.14 2>/dev/null || echo "")
        if [ -z "$PY314" ] || [ ! -x "$PY314" ]; then
          echo "Python 3.14 not found, installing..."
          uv python install 3.14
          PY314=$(uv python find 3.14 2>/dev/null || echo "python3")
        fi
        echo "Using Python: $PY314"
        $PY314 --version
        export PYTHON_BIN="$PY314"
        
        python3 assemble.py 2>&1 | tail -60
        ls -la VidGrab.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab.ipa
        path: VidGrab.ipa
        retention-days: 30
