name: Build VidGrab IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /root/theos
  PYFW_DIR: /root/pyios/ios-arm64
  FFMPEG_DEST: /root/ffmpeg-ios
  YTDLP_VER: "2026.08.19"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
    - uses: actions/checkout@v4

    - name: Install base dependencies
      run: |
        apt-get update
        apt-get install -y build-essential clang git curl wget python3 python3-pip \
          libxml2-dev libssl-dev zlib1g-dev xz-utils cpio ldid pkg-config
        pip3 install uv

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Install iOS 16.5 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        # iOS SDK from the community SDKs repository
        curl -L -o iPhoneOS16.5.sdk.tar.xz \
          https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz || \
        curl -L -o iPhoneOS16.5.sdk.tar.xz \
          https://github.com/CRKatri/iPhoneOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz
        ls -la $THEOS/sdks/

    - name: Prepare Python.xcframework
      run: |
        mkdir -p /root/pyios
        cd /root/pyios
        # Download Python Apple support (contains Python.xcframework with Headers)
        # Adjust version to match the project's Python 3.14 requirement
        curl -L -o Python-Apple-support.tar.gz \
          https://github.com/beeware/Python-Apple-support/releases/download/3.14.0/Python-3.14.0-iOS-support.tar.gz || \
        curl -L -o Python-Apple-support.tar.gz \
          https://github.com/beeware/Python-Apple-support/releases/download/3.13.0/Python-3.13.0-iOS-support.tar.gz
        tar -xzf Python-Apple-support.tar.gz
        # Find and set up the framework
        if [ -d "Python.xcframework" ]; then
          ln -sf $(pwd)/Python.xcframework/ios-arm64 /root/pyios/ios-arm64
        else
          # Try alternative layout
          find . -name "Python.framework" -type d | head -5
        fi
        ls -la /root/pyios/ios-arm64/ || true

    - name: Build LAME (MP3 encoder)
      run: |
        mkdir -p $FFMPEG_DEST/include/lame $FFMPEG_DEST/lib
        cd /tmp
        curl -L -o lame.tar.gz https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download
        tar -xzf lame.tar.gz
        cd lame-3.100
        export SDK=$THEOS/sdks/iPhoneOS16.5.sdk
        export CC="$THEOS/toolchain/linux/iphone/bin/clang -arch arm64 -isysroot $SDK -target arm64-apple-ios15.0"
        ./configure --host=arm-apple-darwin --prefix=$FFMPEG_DEST --enable-static --disable-shared \
          --disable-frontend --disable-gtktest
        make -j$(nproc)
        make install
        ls -la $FFMPEG_DEST/lib/libmp3lame.a

    - name: Build FFmpeg
      run: |
        cd /tmp
        git clone --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
        export FFMPEG_SRC=/tmp/ffmpeg-src
        export FFMPEG_DEST=$FFMPEG_DEST
        export THEOS=$THEOS
        bash $GITHUB_WORKSPACE/tools/build_ffmpeg_ios.sh
        ls -la $FFMPEG_DEST/lib/

    - name: Prepare yt-dlp and Python packages
      run: |
        mkdir -p /root/app_packages
        cd /root/app_packages
        # Download yt-dlp
        curl -L -o yt-dlp.tar.gz https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VER}/yt-dlp.tar.gz
        tar -xzf yt-dlp.tar.gz
        mv yt-dlp yt_dlp_src 2>/dev/null || true
        # Install Python packages into app_packages
        uv pip install --target /root/app_packages --python 3.14 \
          requests certifi charset-normalizer idna urllib3 websockets || \
        uv pip install --target /root/app_packages \
          requests certifi charset-normalizer idna urllib3 websockets
        ls -la /root/app_packages/

    - name: Build main app
      run: |
        export THEOS=$THEOS
        export PYFW_DIR=/root/pyios/ios-arm64
        make clean
        make FINALPACKAGE=1
        ls -la .theos/obj/VidGrab.app/

    - name: Build HUD and Share extension
      run: |
        export THEOS=$THEOS
        make -C hud FINALPACKAGE=1
        make -C share FINALPACKAGE=1
        make -C helper FINALPACKAGE=1 || true
        make -C starter FINALPACKAGE=1 || true

    - name: Assemble IPA
      run: |
        # Set up paths expected by assemble.py
        mkdir -p /root/VidGrab/Resources
        cp -r Resources/* /root/VidGrab/Resources/ 2>/dev/null || true
        # Create yt-dlp zip if needed
        cd /root/app_packages
        if [ -d "yt_dlp" ]; then
          zip -r /root/VidGrab/Resources/yt-dlp yt_dlp yt_dlp_ejs 2>/dev/null || \
          zip -r /root/VidGrab/Resources/yt-dlp yt_dlp 2>/dev/null || true
        fi
        cd $GITHUB_WORKSPACE
        python3 assemble.py
        ls -la VidGrab.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab.ipa
        path: VidGrab.ipa
        retention-days: 30
