name: Build VidGrab IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /home/runner/theos
  PYFW_DIR: /home/runner/pyios/ios-arm64
  FFMPEG_DEST: /home/runner/ffmpeg-ios
  YTDLP_VER: "2026.08.19"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang git curl wget python3 python3-pip \
          libxml2-dev libssl-dev zlib1g-dev xz-utils cpio pkg-config zip unzip
        pip3 install uv
        echo "Base dependencies installed"

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_PATH
        echo "Theos installed"
        ls -la $THEOS/toolchain/linux/iphone/bin/ | head -20

    - name: Install iOS 16.5 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        # Try multiple SDK sources
        SDK_URLS=(
          "https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz"
          "https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz"
          "https://github.com/CRKatri/iPhoneOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz"
        )
        for url in "${SDK_URLS[@]}"; do
          echo "Trying: $url"
          if curl -fL -o iPhoneOS16.5.sdk.tar.xz "$url" 2>/dev/null; then
            echo "Downloaded from $url"
            break
          fi
        done
        if [ -f iPhoneOS16.5.sdk.tar.xz ]; then
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -la $THEOS/sdks/
        else
          echo "ERROR: Failed to download iOS SDK"
          exit 1
        fi

    - name: Prepare Python.xcframework
      run: |
        mkdir -p /home/runner/pyios
        cd /home/runner/pyios
        # Try Python 3.14 first, then 3.13
        PY_URLS=(
          "https://github.com/beeware/Python-Apple-support/releases/download/3.14.0/Python-3.14.0-iOS-support.tar.gz"
          "https://github.com/beeware/Python-Apple-support/releases/download/3.13.0/Python-3.13.0-iOS-support.tar.gz"
          "https://github.com/beeware/Python-Apple-support/releases/download/3.12.0/Python-3.12.0-iOS-support.tar.gz"
        )
        for url in "${PY_URLS[@]}"; do
          echo "Trying: $url"
          if curl -fL -o Python-support.tar.gz "$url" 2>/dev/null; then
            echo "Downloaded from $url"
            break
          fi
        done
        if [ -f Python-support.tar.gz ]; then
          tar -xzf Python-support.tar.gz
          rm Python-support.tar.gz
          # Find the xcframework
          XCFW=$(find . -name "Python.xcframework" -type d | head -1)
          if [ -n "$XCFW" ]; then
            echo "Found Python.xcframework at $XCFW"
            ls -la "$XCFW/"
            # Set up ios-arm64 slice
            if [ -d "$XCFW/ios-arm64" ]; then
              ln -sf "$(pwd)/$XCFW/ios-arm64" /home/runner/pyios/ios-arm64
            elif [ -d "$XCFW/ios-arm64_x86_64-simulator" ]; then
              echo "WARNING: Only simulator slice found"
            fi
            ls -la /home/runner/pyios/ios-arm64/ || true
            ls -la /home/runner/pyios/ios-arm64/Python.framework/ || true
          else
            echo "ERROR: Python.xcframework not found in archive"
            find . -name "*.framework" -type d | head -10
            exit 1
          fi
        else
          echo "ERROR: Failed to download Python.xcframework"
          exit 1
        fi

    - name: Build LAME (MP3 encoder)
      run: |
        mkdir -p $FFMPEG_DEST/include/lame $FFMPEG_DEST/lib
        cd /tmp
        curl -fL -o lame.tar.gz "https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download" || \
        curl -fL -o lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
        tar -xzf lame.tar.gz
        cd lame-3.100
        export SDK=$THEOS/sdks/iPhoneOS16.5.sdk
        export CC="$THEOS/toolchain/linux/iphone/bin/clang -arch arm64 -isysroot $SDK -target arm64-apple-ios15.0"
        ./configure --host=arm-apple-darwin --prefix=$FFMPEG_DEST --enable-static --disable-shared \
          --disable-frontend --disable-gtktest
        make -j$(nproc)
        make install
        ls -la $FFMPEG_DEST/lib/libmp3lame.a

    - name: Build FFmpeg
      run: |
        cd /tmp
        git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
        export FFMPEG_SRC=/tmp/ffmpeg-src
        export FFMPEG_DEST=$FFMPEG_DEST
        export THEOS=$THEOS
        bash $GITHUB_WORKSPACE/tools/build_ffmpeg_ios.sh
        ls -la $FFMPEG_DEST/lib/

    - name: Prepare yt-dlp and Python packages
      run: |
        mkdir -p /home/runner/app_packages
        cd /home/runner/app_packages
        # Download yt-dlp
        curl -fL -o yt-dlp.tar.gz "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VER}/yt-dlp.tar.gz" || \
        curl -fL -o yt-dlp.tar.gz "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.tar.gz"
        tar -xzf yt-dlp.tar.gz
        rm yt-dlp.tar.gz
        # Install Python packages
        uv pip install --target /home/runner/app_packages \
          requests certifi charset-normalizer idna urllib3 websockets
        ls -la /home/runner/app_packages/

    - name: Build main app
      run: |
        export THEOS=$THEOS
        export PYFW_DIR=/home/runner/pyios/ios-arm64
        make clean
        make FINALPACKAGE=1 2>&1 | tail -50
        ls -la .theos/obj/VidGrab.app/

    - name: Build HUD and Share extension
      run: |
        export THEOS=$THEOS
        make -C hud FINALPACKAGE=1 2>&1 | tail -20
        make -C share FINALPACKAGE=1 2>&1 | tail -20
        make -C helper FINALPACKAGE=1 2>&1 | tail -20 || true
        make -C starter FINALPACKAGE=1 2>&1 | tail -20 || true

    - name: Assemble IPA
      env:
        APP_PACKAGES: /home/runner/app_packages
        PYTHON_XCFRAMEWORK: /home/runner/pyios/Python.xcframework
      run: |
        # Set up paths expected by assemble.py
        mkdir -p /home/runner/VidGrab/Resources
        cp -r Resources/* /home/runner/VidGrab/Resources/ 2>/dev/null || true
        # Create yt-dlp zip
        cd /home/runner/app_packages
        if [ -d "yt_dlp" ]; then
          zip -r /home/runner/VidGrab/Resources/yt-dlp yt_dlp yt_dlp_ejs 2>/dev/null || \
          zip -r /home/runner/VidGrab/Resources/yt-dlp yt_dlp 2>/dev/null || true
        fi
        cd $GITHUB_WORKSPACE
        python3 assemble.py 2>&1 | tail -30
        ls -la VidGrab.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab.ipa
        path: VidGrab.ipa
        retention-days: 30
